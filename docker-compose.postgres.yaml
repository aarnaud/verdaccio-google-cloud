# Registry state in PostgreSQL instead of the Datastore emulator:
#   docker compose -f docker-compose.yaml -f docker-compose.postgres.yaml up -d
# (--build after changing the plugin)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=verdaccio
      - POSTGRES_PASSWORD=verdaccio
      - POSTGRES_DB=verdaccio
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verdaccio -d verdaccio']
      interval: 5s
      timeout: 5s
      retries: 10

  datastore-emulator:
    profiles: ['datastore-only']

  verdaccio:
    depends_on: !override
      fake-gcs-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      init-resources:
        condition: service_completed_successfully
    environment: !override
      - GOOGLE_CLOUD_PROJECT=verdaccio-test
      - GCS_BUCKET=verdaccio-storage
      - GCS_API_ENDPOINT=http://fake-gcs-server:5050
      - DATABASE_URL=postgres://verdaccio:verdaccio@postgres:5432/verdaccio
      - DEBUG=verdaccio:plugin*
    volumes:
      - ./conf/config.postgres.yaml:/verdaccio/conf/config.yaml:ro
